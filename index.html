<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Detoke: los comercios de tu barrio, con su catálogo y pedidos por WhatsApp." />
    <meta name="theme-color" content="#FBF7EE" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Detoke</title>
    <script>
      try {
        var t = localStorage.getItem('detoke.theme');
        if (t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
