# Render Blueprint: web service + Postgres. Secrets are set in the dashboard (sync: false).
services:
  - type: web
    name: detoke
    runtime: node
    plan: free
    # tsx and vite are devDependencies: install them even with NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://detoke.onrender.com
      - key: CORS_ORIGINS
        value: https://detoke.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: detoke-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://detoke.onrender.com/api/auth/google/callback
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_WHATSAPP
        sync: false
      - key: CONTACT_HOURS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # With a Persistent Disk (paid plans) mounted at /var/data, point uploads to it:
      # - key: UPLOADS_DIR
      #   value: /var/data/uploads

databases:
  - name: detoke-db
    plan: free
